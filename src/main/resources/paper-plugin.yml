name: TeaStory
version: '${version}'
main: com.github.cinnaio.teastory.TeaStoryPlugin
api-version: '26.1'
folia-supported: true
authors:
  - Cinnaio
description: TeaStory machines and harvest tools for CraftEngine-backed content.
libraries:
  - org.xerial:sqlite-jdbc:3.46.1.0
permissions:
  teastory.admin:
    default: op
  teastory.harvest:
    default: true
  teastory.harvest.others:
    default: op
  materiaengine.admin:
    default: op
  materiaengine.harvest:
    default: true
  materiaengine.harvest.others:
    default: op
dependencies:
  server:
    CraftEngine:
      required: false
      load: BEFORE
      join-classpath: true
    BeaconEngine:
      required: false
      load: BEFORE
      join-classpath: false
    Residence:
      required: false
      load: BEFORE
      join-classpath: false
    WorldGuard:
      required: false
      load: BEFORE
      join-classpath: false
    HuskTowns:
      required: false
      load: BEFORE
      join-classpath: false
