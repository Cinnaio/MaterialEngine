machines:
  # ===== 炒茶锅：火炒杀青 / 炒青（原版燃料）=====
  tea-drying-pan:
    block:
      id: cgap:tea_drying_pan
      state:
        property: filled
        type: boolean
        default: 0
        filled: 1
        running: 1
    processing:
      process-ticks: 100
    inventory:
      input-slot: 2
      fuel-slot: 20
      output-slot: 15
    gui:
      image-token: <image:cgap:tea_stove_gui>
      title: "<white><shift:-9>{image}<shift:-103>{progress}<shift:-53>{fire}<shift:-53><reset>{name}"
      title-update-ticks: 5
      progress-image-width: 24
      progress-char-start: 59776
      fire-char-start: 59808
      fire-frames: 4
    effects:
      particle: campfire_cosy_smoke
      particle-interval: 5
      particle-count: 2
      particle-y-offset: 1.05
      particle-spread-y: 0.12
      sounds:
        open: { key: minecraft:block.barrel.open, volume: 0.6, pitch: 1.0 }
        close: { key: minecraft:block.barrel.close, volume: 0.6, pitch: 1.0 }
        start: { key: minecraft:item.flintandsteel.use, volume: 0.8, pitch: 1.0 }
        finish: { key: minecraft:block.smoker.smoke, volume: 0.9, pitch: 1.0 }
        ambient: { key: minecraft:block.campfire.crackle, volume: 0.6, pitch: 1.0, interval: 40 }
        fuel-consume: { key: minecraft:item.flintandsteel.use, volume: 0.6, pitch: 0.8 }
    recipes:
      # --- 杀青：分级萎凋叶 -> 青叶（芽/一叶出 2，其余出 1）---
      fixation-bud:
        input:
          id: cgap:withered_tea_leaf_bud
          amount: 1
        process-ticks: 100
        output:
          id: cgap:tea_leaf
          amount: 2
      fixation-bud-leaf1:
        input:
          id: cgap:withered_tea_leaf_bud_leaf1
          amount: 1
        process-ticks: 100
        output:
          id: cgap:tea_leaf
          amount: 2
      fixation-bud-leaf2:
        input:
          id: cgap:withered_tea_leaf_bud_leaf2
          amount: 1
        process-ticks: 100
        output:
          id: cgap:tea_leaf
          amount: 1
      fixation-bud-leaf3:
        input:
          id: cgap:withered_tea_leaf_bud_leaf3
          amount: 1
        process-ticks: 100
        output:
          id: cgap:tea_leaf
          amount: 1
      fixation-old-leaf:
        input:
          id: cgap:withered_tea_leaf_old_leaf
          amount: 1
        process-ticks: 100
        output:
          id: cgap:tea_leaf
          amount: 1
      fixation-plain:
        input:
          id: cgap:withered_tea_leaf
          amount: 1
        process-ticks: 100
        output:
          id: cgap:tea_leaf
          amount: 1
      # --- 炒青：青叶 -> 绿茶 ---
      pan-firing-green:
        input:
          id: cgap:tea_leaf
          amount: 1
        process-ticks: 120
        output:
          id: cgap:green_tea_leaf
          amount: 1
      # --- 误炒：湿叶下锅只会炒焦（焦叶可回收成发酵粉）---
      scorch-wet:
        input:
          id: cgap:wet_tea_leaf
          amount: 1
        process-ticks: 80
        output:
          id: cgap:failed_fixation_tea_leaf
          amount: 1

  # ===== 茶盘：露天看天（无燃料）——萎凋 / 淋湿 / 挽救 / 闷黄 =====
  teapan:
    block:
      id: cgap:teapan
      state:
        property: stage
        type: int
        default: 0
        filled: 1
        running: 1
    processing:
      process-ticks: 100
    inventory:
      input-slot: 12
      output-slot: 14
    gui:
      image-token: <image:cgap:tea_drying_pan_gui>
      title: "<white><shift:-9>{image}<shift:-143>{progress}<shift:-138><reset>{name}"
      title-update-ticks: 5
      progress-image-width: 108
    effects:
      sounds:
        open: { key: minecraft:block.barrel.open, volume: 0.6, pitch: 1.2 }
        close: { key: minecraft:block.barrel.close, volume: 0.6, pitch: 1.2 }
        start: { key: minecraft:item.bone_meal.use, volume: 0.8, pitch: 1.0 }
        finish: { key: minecraft:block.composter.ready, volume: 0.9, pitch: 1.1 }
        ambient: { key: minecraft:block.cherry_leaves.step, volume: 0.5, pitch: 0.9, interval: 60 }
    recipes:
      # --- 萎凋（晴天）：分级鲜叶 -> 同级萎凋叶 ---
      wither-bud:
        input:
          id: cgap:fresh_tea_leaf_bud
          amount: 1
        conditions:
          weather: clear
        process-ticks: 100
        output-state: 3
        output:
          id: cgap:withered_tea_leaf_bud
          amount: 1
      wither-bud-leaf1:
        input:
          id: cgap:fresh_tea_leaf_bud_leaf1
          amount: 1
        conditions:
          weather: clear
        process-ticks: 100
        output-state: 3
        output:
          id: cgap:withered_tea_leaf_bud_leaf1
          amount: 1
      wither-bud-leaf2:
        input:
          id: cgap:fresh_tea_leaf_bud_leaf2
          amount: 1
        conditions:
          weather: clear
        process-ticks: 100
        output-state: 3
        output:
          id: cgap:withered_tea_leaf_bud_leaf2
          amount: 1
      wither-bud-leaf3:
        input:
          id: cgap:fresh_tea_leaf_bud_leaf3
          amount: 1
        conditions:
          weather: clear
        process-ticks: 100
        output-state: 3
        output:
          id: cgap:withered_tea_leaf_bud_leaf3
          amount: 1
      wither-old-leaf:
        input:
          id: cgap:fresh_tea_leaf_old_leaf
          amount: 1
        conditions:
          weather: clear
        process-ticks: 100
        output-state: 3
        output:
          id: cgap:withered_tea_leaf_old_leaf
          amount: 1
      # --- 淋湿（雨天）：鲜叶失去分级变湿叶 ---
      soak-bud-rain:
        input:
          id: cgap:fresh_tea_leaf_bud
          amount: 1
        conditions:
          weather: rain
        process-ticks: 60
        output-state: 2
        output:
          id: cgap:wet_tea_leaf
          amount: 1
      soak-bud-leaf1-rain:
        input:
          id: cgap:fresh_tea_leaf_bud_leaf1
          amount: 1
        conditions:
          weather: rain
        process-ticks: 60
        output-state: 2
        output:
          id: cgap:wet_tea_leaf
          amount: 1
      soak-bud-leaf2-rain:
        input:
          id: cgap:fresh_tea_leaf_bud_leaf2
          amount: 1
        conditions:
          weather: rain
        process-ticks: 60
        output-state: 2
        output:
          id: cgap:wet_tea_leaf
          amount: 1
      soak-bud-leaf3-rain:
        input:
          id: cgap:fresh_tea_leaf_bud_leaf3
          amount: 1
        conditions:
          weather: rain
        process-ticks: 60
        output-state: 2
        output:
          id: cgap:wet_tea_leaf
          amount: 1
      soak-old-leaf-rain:
        input:
          id: cgap:fresh_tea_leaf_old_leaf
          amount: 1
        conditions:
          weather: rain
        process-ticks: 60
        output-state: 2
        output:
          id: cgap:wet_tea_leaf
          amount: 1
      # --- 淋湿（雷暴，更快淋透）---
      soak-bud-thunder:
        input:
          id: cgap:fresh_tea_leaf_bud
          amount: 1
        conditions:
          weather: thunder
        process-ticks: 40
        output-state: 2
        output:
          id: cgap:wet_tea_leaf
          amount: 1
      soak-bud-leaf1-thunder:
        input:
          id: cgap:fresh_tea_leaf_bud_leaf1
          amount: 1
        conditions:
          weather: thunder
        process-ticks: 40
        output-state: 2
        output:
          id: cgap:wet_tea_leaf
          amount: 1
      soak-bud-leaf2-thunder:
        input:
          id: cgap:fresh_tea_leaf_bud_leaf2
          amount: 1
        conditions:
          weather: thunder
        process-ticks: 40
        output-state: 2
        output:
          id: cgap:wet_tea_leaf
          amount: 1
      soak-bud-leaf3-thunder:
        input:
          id: cgap:fresh_tea_leaf_bud_leaf3
          amount: 1
        conditions:
          weather: thunder
        process-ticks: 40
        output-state: 2
        output:
          id: cgap:wet_tea_leaf
          amount: 1
      soak-old-leaf-thunder:
        input:
          id: cgap:fresh_tea_leaf_old_leaf
          amount: 1
        conditions:
          weather: thunder
        process-ticks: 40
        output-state: 2
        output:
          id: cgap:wet_tea_leaf
          amount: 1
      # --- 挽救：湿叶晴天摊晾成无分级萎凋叶 ---
      rescue-wet:
        input:
          id: cgap:wet_tea_leaf
          amount: 1
        conditions:
          weather: clear
        process-ticks: 140
        output-state: 3
        output:
          id: cgap:withered_tea_leaf
          amount: 1
      # --- 闷黄：绿茶堆闷成黄茶（不看天）---
      yellowing:
        input:
          id: cgap:green_tea_leaf
          amount: 1
        process-ticks: 160
        output-state: 4
        output:
          id: cgap:yellow_tea_leaf
          amount: 1

  # ===== 发酵桶：发酵粉驱动（fuel-items 为独占燃料表），GUI 与茶盘同款布局 =====
  barrel:
    block:
      id: cgap:barrel
      state:
        property: stage
        type: int
        default: 0
        filled: 1
        running: 2
    processing:
      process-ticks: 160
    inventory:
      input-slot: 12
      fuel-slot: 13
      output-slot: 14
    gui:
      image-token: <image:cgap:fermentation_barrel_gui>
      title: "<white><shift:-9>{image}<shift:-143>{progress}<shift:-138><reset>{name}"
      title-update-ticks: 5
      progress-image-width: 108
    effects:
      sounds:
        open: { key: minecraft:block.barrel.open, volume: 0.6, pitch: 0.9 }
        close: { key: minecraft:block.barrel.close, volume: 0.6, pitch: 0.9 }
        start: { key: minecraft:block.grass.place, volume: 0.8, pitch: 0.8 }
        finish: { key: minecraft:block.brewing_stand.brew, volume: 0.9, pitch: 0.9 }
        ambient: { key: minecraft:block.bubble_column.bubble_pop, volume: 0.5, pitch: 0.8, interval: 30 }
        fuel-consume: { key: minecraft:block.composter.fill_success, volume: 0.7, pitch: 1.0 }
    fuel-items:
      cgap:baking_powder: 800
    recipes:
      broken-to-semi:
        input:
          id: cgap:broken_tea_leaf
          amount: 1
        process-ticks: 160
        output-state: 1
        output:
          id: cgap:semi_fermented_tea_leaf
          amount: 1
      semi-to-full:
        input:
          id: cgap:semi_fermented_tea_leaf
          amount: 1
        process-ticks: 180
        output-state: 3
        output:
          id: cgap:fully_fermented_tea_leaf
          amount: 1
      full-to-deep:
        input:
          id: cgap:fully_fermented_tea_leaf
          amount: 1
        process-ticks: 200
        output-state: 4
        output:
          id: cgap:deep_fermented_tea_leaf
          amount: 1

  # ===== 茶炉：烘焙 / 烘青 / 蒸青（原版燃料）=====
  tea-stove:
    block:
      id: cgap:tea_stove
      state:
        property: lit
        type: boolean
        default: 0
        filled: 0
        running: 1
    processing:
      process-ticks: 200
    inventory:
      input-slot: 2
      fuel-slot: 20
      output-slot: 15
    gui:
      image-token: <image:cgap:tea_stove_gui>
      title: "<white><shift:-9>{image}<shift:-103>{progress}<shift:-53>{fire}<shift:-53><reset>{name}"
      title-update-ticks: 2
      progress-image-width: 24
      progress-char-start: 59776
      fire-char-start: 59808
      fire-frames: 4
    effects:
      sounds:
        open: { key: minecraft:block.barrel.open, volume: 0.6, pitch: 1.0 }
        close: { key: minecraft:block.barrel.close, volume: 0.6, pitch: 1.0 }
        start: { key: minecraft:item.flintandsteel.use, volume: 0.8, pitch: 1.0 }
        finish: { key: minecraft:block.brewing_stand.brew, volume: 0.9, pitch: 1.0 }
        ambient: { key: minecraft:block.blast_furnace.fire_crackle, volume: 0.6, pitch: 1.0, interval: 40 }
        fuel-consume: { key: minecraft:item.flintandsteel.use, volume: 0.6, pitch: 0.8 }
    recipes:
      # --- 烘焙：发酵叶 -> 成品茶 ---
      semi-to-oolong:
        input:
          id: cgap:semi_fermented_tea_leaf
          amount: 1
        output:
          id: cgap:oolong_tea_leaf
          amount: 1
      full-to-black:
        input:
          id: cgap:fully_fermented_tea_leaf
          amount: 1
        output:
          id: cgap:black_tea_leaf
          amount: 1
      deep-to-puer:
        input:
          id: cgap:deep_fermented_tea_leaf
          amount: 1
        output:
          id: cgap:puer_tea_leaf
          amount: 1
      # --- 烘青：青叶低温烘干 -> 白茶 ---
      tea-leaf-to-white:
        input:
          id: cgap:tea_leaf
          amount: 1
        process-ticks: 160
        output:
          id: cgap:white_tea_leaf
          amount: 1
      # --- 蒸青：绿茶蒸后碾磨 -> 抹茶 ---
      green-to-matcha:
        input:
          id: cgap:green_tea_leaf
          amount: 1
        process-ticks: 160
        output:
          id: cgap:matcha_tea_leaf
          amount: 1

  # ===== 茶桌：冲泡 + 倒茶（无燃料）=====
  tea-table:
    block:
      id: cgap:tea_table
    processing:
      process-ticks: 100
    inventory:
      tool-slot: 1
      sugar-slot: 2
      cup-slot: 6
      water-slot: 10
      leaf-slot: 11
      output-slot: 15
    gui:
      image-token: <image:cgap:tea_table_gui>
      title: "<white><shift:-9>{image}<shift:-103>{progress}<shift:-106><reset>{name}"
      title-update-ticks: 5
      progress-image-width: 24
      progress-char-start: 59776  # 复用茶炉 25 帧箭头；59808 起是火焰字符区，不能用作进度
    effects:
      sounds:
        open: { key: minecraft:block.barrel.open, volume: 0.6, pitch: 1.1 }
        close: { key: minecraft:block.barrel.close, volume: 0.6, pitch: 1.1 }
        start: { key: minecraft:item.bottle.fill, volume: 0.8, pitch: 1.0 }
        finish: { key: minecraft:entity.generic.drink, volume: 0.8, pitch: 1.0 }
    # 冲泡用开水：任意材质开水壶均可，消耗后按材质返还对应空壶
    boiled-water: &boiled_water
      any:
        - { id: cgap:boiled_water_pot_stone, consume-replacement: cgap:pot_stone }
        - { id: cgap:boiled_water_pot_porcelain, consume-replacement: cgap:pot_porcelain }
        - { id: cgap:boiled_water_pot_iron, consume-replacement: cgap:pot_iron }
        - { id: cgap:boiled_water_pot_zisha, consume-replacement: cgap:pot_zisha }
    # 倒茶用满壶：两种材质均可，每倒一杯扣 1 耐久，倒空替换为对应空壶
    pour-kettles:
      black-tea: &pour_black
        damage: 1
        any:
          - { id: cgap:black_tea_porcelain_kettle, consume-replacement: cgap:empty_porcelain_kettle }
          - { id: cgap:black_tea_zisha_kettle, consume-replacement: cgap:empty_zisha_kettle }
      green-tea: &pour_green
        damage: 1
        any:
          - { id: cgap:green_tea_porcelain_kettle, consume-replacement: cgap:empty_porcelain_kettle }
          - { id: cgap:green_tea_zisha_kettle, consume-replacement: cgap:empty_zisha_kettle }
      oolong-tea: &pour_oolong
        damage: 1
        any:
          - { id: cgap:oolong_tea_porcelain_kettle, consume-replacement: cgap:empty_porcelain_kettle }
          - { id: cgap:oolong_tea_zisha_kettle, consume-replacement: cgap:empty_zisha_kettle }
      puer-tea: &pour_puer
        damage: 1
        any:
          - { id: cgap:puer_tea_porcelain_kettle, consume-replacement: cgap:empty_porcelain_kettle }
          - { id: cgap:puer_tea_zisha_kettle, consume-replacement: cgap:empty_zisha_kettle }
      white-tea: &pour_white
        damage: 1
        any:
          - { id: cgap:white_tea_porcelain_kettle, consume-replacement: cgap:empty_porcelain_kettle }
          - { id: cgap:white_tea_zisha_kettle, consume-replacement: cgap:empty_zisha_kettle }
      yellow-tea: &pour_yellow
        damage: 1
        any:
          - { id: cgap:yellow_tea_porcelain_kettle, consume-replacement: cgap:empty_porcelain_kettle }
          - { id: cgap:yellow_tea_zisha_kettle, consume-replacement: cgap:empty_zisha_kettle }
      matcha-drink: &pour_matcha
        damage: 1
        any:
          - { id: cgap:matcha_drink_porcelain_kettle, consume-replacement: cgap:empty_porcelain_kettle }
          - { id: cgap:matcha_drink_zisha_kettle, consume-replacement: cgap:empty_zisha_kettle }
      milk-tea: &pour_milk
        damage: 1
        any:
          - { id: cgap:milk_tea_porcelain_kettle, consume-replacement: cgap:empty_porcelain_kettle }
          - { id: cgap:milk_tea_zisha_kettle, consume-replacement: cgap:empty_zisha_kettle }
      lemon-tea: &pour_lemon
        damage: 1
        any:
          - { id: cgap:lemon_tea_porcelain_kettle, consume-replacement: cgap:empty_porcelain_kettle }
          - { id: cgap:lemon_tea_zisha_kettle, consume-replacement: cgap:empty_zisha_kettle }
    # 配方按声明槽位做首匹配：特化配方（奶/柠/抹茶，声明 tool/sugar）必须排在同茶底的通用配方之前
    recipes:
      # ===== 杯装奶茶：红茶×2 + 奶桶（返空桶）+ 糖×3 =====
      milk-tea-glass:
        inputs:
          leaf: { id: cgap:black_tea_leaf, amount: 2 }
          tool: { id: minecraft:milk_bucket, consume-replacement: minecraft:bucket }
          sugar: { id: minecraft:sugar, amount: 3 }
          water: *boiled_water
          cup: { id: cgap:cup_glass }
        output: { id: cgap:milk_tea_glass }
      milk-tea-stone:
        inputs:
          leaf: { id: cgap:black_tea_leaf, amount: 2 }
          tool: { id: minecraft:milk_bucket, consume-replacement: minecraft:bucket }
          sugar: { id: minecraft:sugar, amount: 3 }
          water: *boiled_water
          cup: { id: cgap:cup_stone }
        output: { id: cgap:milk_tea_stone }
      milk-tea-wood:
        inputs:
          leaf: { id: cgap:black_tea_leaf, amount: 2 }
          tool: { id: minecraft:milk_bucket, consume-replacement: minecraft:bucket }
          sugar: { id: minecraft:sugar, amount: 3 }
          water: *boiled_water
          cup: { id: cgap:cup_wood }
        output: { id: cgap:milk_tea_wood }
      milk-tea-porcelain:
        inputs:
          leaf: { id: cgap:black_tea_leaf, amount: 2 }
          tool: { id: minecraft:milk_bucket, consume-replacement: minecraft:bucket }
          sugar: { id: minecraft:sugar, amount: 3 }
          water: *boiled_water
          cup: { id: cgap:cup_porcelain }
        output: { id: cgap:milk_tea_porcelain }
      milk-tea-zisha:
        inputs:
          leaf: { id: cgap:black_tea_leaf, amount: 2 }
          tool: { id: minecraft:milk_bucket, consume-replacement: minecraft:bucket }
          sugar: { id: minecraft:sugar, amount: 3 }
          water: *boiled_water
          cup: { id: cgap:cup_zisha }
        output: { id: cgap:milk_tea_zisha }
      # ===== 杯装柠檬茶：红茶×2 + 柠檬 + 糖×3 =====
      lemon-tea-glass:
        inputs:
          leaf: { id: cgap:black_tea_leaf, amount: 2 }
          tool: { id: cgap:lemon }
          sugar: { id: minecraft:sugar, amount: 3 }
          water: *boiled_water
          cup: { id: cgap:cup_glass }
        output: { id: cgap:lemon_tea_glass }
      lemon-tea-stone:
        inputs:
          leaf: { id: cgap:black_tea_leaf, amount: 2 }
          tool: { id: cgap:lemon }
          sugar: { id: minecraft:sugar, amount: 3 }
          water: *boiled_water
          cup: { id: cgap:cup_stone }
        output: { id: cgap:lemon_tea_stone }
      lemon-tea-wood:
        inputs:
          leaf: { id: cgap:black_tea_leaf, amount: 2 }
          tool: { id: cgap:lemon }
          sugar: { id: minecraft:sugar, amount: 3 }
          water: *boiled_water
          cup: { id: cgap:cup_wood }
        output: { id: cgap:lemon_tea_wood }
      lemon-tea-porcelain:
        inputs:
          leaf: { id: cgap:black_tea_leaf, amount: 2 }
          tool: { id: cgap:lemon }
          sugar: { id: minecraft:sugar, amount: 3 }
          water: *boiled_water
          cup: { id: cgap:cup_porcelain }
        output: { id: cgap:lemon_tea_porcelain }
      lemon-tea-zisha:
        inputs:
          leaf: { id: cgap:black_tea_leaf, amount: 2 }
          tool: { id: cgap:lemon }
          sugar: { id: minecraft:sugar, amount: 3 }
          water: *boiled_water
          cup: { id: cgap:cup_zisha }
        output: { id: cgap:lemon_tea_zisha }
      # ===== 杯装抹茶：抹茶×2 + 茶筅（耗 1 耐久）+ 糖×3 =====
      matcha-drink-glass:
        inputs:
          leaf: { id: cgap:matcha_tea_leaf, amount: 2 }
          tool: { id: cgap:tea_whisk, damage: 1 }
          sugar: { id: minecraft:sugar, amount: 3 }
          water: *boiled_water
          cup: { id: cgap:cup_glass }
        process-ticks: 120
        output: { id: cgap:matcha_drink_glass }
      matcha-drink-stone:
        inputs:
