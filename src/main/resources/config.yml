# ===== 镰刀：范围收割 + 自动续种 =====
# 右键成熟作物触发；半径 1 = 3x3。背包有对应种子则原位续种成 age0。
# 消耗耐久 = 收割数量（受耐久附魔减免）；掉落吃时运附魔。镰刀为 iron_hoe，右键锄地已被插件拦截。
# 每株独立检查成熟、领地权限和耐久；范围上限为半径 2，仅处理已加载且当前区域拥有的方块。
sickle:
  item: cgap:sickle
  radius: 1
  cooldown-ticks: 4
  durability-cost: 1
  crops:
    cgap:tea_tree_crop: { seed: cgap:tea_seeds, mature-age: 6 }
    cgap:jasmine_flower_crop: { seed: cgap:jasmine_seeds, mature-age: 3 }
    cgap:xian_rice_plant_crop: { seed: cgap:item_xian_rice_seedling, mature-age: 7 }
    cgap:xian_rice_seed_crop: { seed: cgap:xian_rice_seeds, mature-age: 3 }
    cgap:osmanthus_flower_crop: { seed: cgap:osmanthus_seeds, mature-age: 3 }
    cgap:cassava_crop: { seed: cgap:cassava_cutting, mature-age: 4 }
    cgap:mint_crop: { seed: cgap:mint_seeds, mature-age: 3 }
    cgap:chrysanthemum_crop: { seed: cgap:chrysanthemum_seeds, mature-age: 3 }
    cgap:ginger_crop: { seed: cgap:ginger_rhizome, mature-age: 4 }
    cgap:mung_bean_crop: { seed: cgap:mung_bean_seeds, mature-age: 3 }
    cgap:lemongrass_crop: { seed: cgap:lemongrass_seeds, mature-age: 3 }
    cgap:roselle_crop: { seed: cgap:roselle_seeds, mature-age: 3 }
    cgap:goji_crop: { seed: cgap:goji_seeds, mature-age: 3 }
    cgap:lotus_crop: { seed: cgap:lotus_seeds, mature-age: 4 }
    minecraft:wheat: { seed: minecraft:wheat_seeds, mature-age: 7 }
    minecraft:carrots: { seed: minecraft:carrot, mature-age: 7 }
    minecraft:potatoes: { seed: minecraft:potato, mature-age: 7 }
    minecraft:beetroots: { seed: minecraft:beetroot_seeds, mature-age: 3 }
    minecraft:nether_wart: { seed: minecraft:nether_wart, mature-age: 3 }

# 采收增益只处理本次右键采收。原掉落表与时运先结算，再应用一种主工具增益。
# 背包已有种子时消耗 1 份原位续种；副手采收篓将本次掉落收入背包，溢出仍落地。
harvest-tools:
  enabled: true
  basket: cgap:harvest_basket
  # 通用采收动作参数；单个工具可在 tools.<name> 下覆盖。
  cooldown-ticks: 4
  durability-cost: 1
  # 自然生成的树叶采后等待 20 分钟，在原区块内持久化；区块加载时每分钟检查一次。
  # 离线时间计入等待，未加载区块不会强制加载；已拆除树叶不会重新放置。
  regrow-seconds: 1200
  # 按树叶种类覆盖重新结果秒数；仅影响新采收记录，不重写已有到期时间。
  # 例如 cgap:peach_leaves: 1800；范围 60 ~ 604800 秒。
  regrow-overrides: {}
  fruits:
    cgap:peach_leaves: cgap:peach
    cgap:lemon_leaves: cgap:lemon
    cgap:jujube_leaves: cgap:jujube
    cgap:pomelo_leaves: cgap:pomelo
    cgap:orange_leaves: cgap:orange
    cgap:persimmon_leaves: cgap:persimmon
  # 采收反馈使用原版声音/粒子，避免额外资源包音频依赖。
  feedback:
    enabled: true
    actionbar: true
    sounds: true
    particles: true
    # 失败/冷却提示至少间隔 20 tick，也避免立即覆盖上一次成功提示。
    failure-interval-ticks: 20
    success:
      sound: minecraft:block.grass.break
      volume: 0.65
      pitch: 1.1
      particle: HAPPY_VILLAGER
      count: 4
      offset: 0.25
    bonus:
      sound: minecraft:entity.player.levelup
      volume: 0.45
      pitch: 1.8
      particle: COMPOSTER
      count: 6
      offset: 0.3
    quality:
      sound: minecraft:block.amethyst_block.chime
      volume: 0.55
      pitch: 1.5
      particle: ENCHANT
      count: 8
      offset: 0.25
    fruit:
      sound: minecraft:block.azalea_leaves.break
      volume: 0.65
      pitch: 1.0
      particle: HAPPY_VILLAGER
      count: 5
      offset: 0.25
    failure:
      sound: minecraft:block.note_block.bass
      volume: 0.35
      pitch: 0.7
      particle: SMOKE
      count: 0
      offset: 0
    cooldown:
      sound: minecraft:block.note_block.bass
      volume: 0.25
      pitch: 0.5
      particle: ''
      count: 0
      offset: 0
  # 采收统计按玩家、工具、作物持久化到 plugins/MateriaEngine/harvest_stats.db。
  stats:
    enabled: true
    include-creative: false
    flush-seconds: 30
    # 日统计按此时区划分，本周从周一开始；旧版本累计数据不补记到某一天。
    timezone: Asia/Shanghai
  tools:
    tea-shears:
      item: cgap:tea_shears
      mode: quality
      targets:
        cgap:tea_tree_crop: cgap:fresh_tea_leaf
      # 35% 概率将二叶、三叶或老叶换为高品质鲜叶，数量保持原样；不改种子掉落。
      chance: 0.35
      quality-sources:
        - cgap:fresh_tea_leaf_bud_leaf2
        - cgap:fresh_tea_leaf_bud_leaf3
        - cgap:fresh_tea_leaf_old_leaf
      quality-targets:
        cgap:fresh_tea_leaf_bud: 1
        cgap:fresh_tea_leaf_bud_leaf1: 3
    herb-shears:
      item: cgap:herb_shears
      mode: bonus
      chance: 0.20
      bonus-amount: 1
      # 可按作物覆盖概率，例如 cgap:mint_crop: 0.15；其余沿用 chance。
      target-chances: {}
      targets:
        cgap:jasmine_flower_crop: cgap:fresh_jasmine
        cgap:osmanthus_flower_crop: cgap:fresh_osmanthus
        cgap:mint_crop: cgap:fresh_mint
        cgap:chrysanthemum_crop: cgap:fresh_chrysanthemum
        cgap:lemongrass_crop: cgap:fresh_lemongrass
        cgap:roselle_crop: cgap:fresh_roselle
    root-spade:
      item: cgap:root_spade
      mode: bonus
      chance: 0.25
      bonus-amount: 1
      targets:
        cgap:ginger_crop: cgap:ginger
        cgap:cassava_crop: cgap:cassava_root
    fruit-picker:
      item: cgap:fruit_picker
      mode: fruit
      # 从眼睛位置沿视线检查第一个方块，树叶和墙体均不能穿透；每次采一片结果树叶。
      reach: 5.0
