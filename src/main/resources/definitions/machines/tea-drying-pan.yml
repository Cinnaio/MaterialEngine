# TeaStory machine definition: tea-drying-pan

block:
  id: cgap:tea_drying_pan
  state:
    property: filled
    type: boolean
    default: 0
    filled: 1
    running: 1
processing:
  process-ticks: 100
inventory:
  input-slot: 2
  fuel-slot: 20
  output-slot: 15
gui:
  image-token: <image:cgap:tea_stove_gui>
  title: "<white><shift:-9>{image}<shift:-103>{progress}<shift:-53>{fire}<shift:10><reset>{name}"
  title-update-ticks: 5
  progress-image-width: 24
  progress-char-start: 59776
  fire-char-start: 59808
  fire-frames: 4
effects:
  particle: campfire_cosy_smoke
  particle-interval: 5
  particle-count: 2
  particle-y-offset: 1.05
  particle-spread-y: 0.12
  sounds:
    open: { key: minecraft:block.barrel.open, volume: 0.6, pitch: 1.0 }
    close: { key: minecraft:block.barrel.close, volume: 0.6, pitch: 1.0 }
    start: { key: minecraft:item.flintandsteel.use, volume: 0.8, pitch: 1.0 }
    finish: { key: minecraft:block.smoker.smoke, volume: 0.9, pitch: 1.0 }
    ambient: { key: minecraft:block.campfire.crackle, volume: 0.6, pitch: 1.0, interval: 40 }
    fuel-consume: { key: minecraft:item.flintandsteel.use, volume: 0.6, pitch: 0.8 }
recipes:
  # --- 杀青：分级萎凋叶 -> 青叶（芽/一叶出 2，其余出 1）---
  fixation-bud:
    input:
      id: cgap:withered_tea_leaf_bud
      amount: 1
    process-ticks: 100
    output:
      id: cgap:tea_leaf
      amount: 2
  fixation-bud-leaf1:
    input:
      id: cgap:withered_tea_leaf_bud_leaf1
      amount: 1
    process-ticks: 100
    output:
      id: cgap:tea_leaf
      amount: 2
  fixation-bud-leaf2:
    input:
      id: cgap:withered_tea_leaf_bud_leaf2
      amount: 1
    process-ticks: 100
    output:
      id: cgap:tea_leaf
      amount: 1
  fixation-bud-leaf3:
    input:
      id: cgap:withered_tea_leaf_bud_leaf3
      amount: 1
    process-ticks: 100
    output:
      id: cgap:tea_leaf
      amount: 1
  fixation-old-leaf:
    input:
      id: cgap:withered_tea_leaf_old_leaf
      amount: 1
    process-ticks: 100
    output:
      id: cgap:tea_leaf
      amount: 1
  fixation-plain:
    input:
      id: cgap:withered_tea_leaf
      amount: 1
    process-ticks: 100
    output:
      id: cgap:tea_leaf
      amount: 1
  # --- 炒青：青叶 -> 绿茶 ---
  pan-firing-green:
    input:
      id: cgap:tea_leaf
      amount: 1
    process-ticks: 120
    output:
      id: cgap:green_tea_leaf
      amount: 1
  # --- 误炒：湿叶下锅只会炒焦（焦叶可回收成发酵粉）---
  scorch-wet:
    input:
      id: cgap:wet_tea_leaf
      amount: 1
    process-ticks: 80
    output:
      id: cgap:failed_fixation_tea_leaf
      amount: 1
