      sugar: { id: minecraft:sugar, amount: 24 }
      water: *boiled_water
      cup: { id: cgap:empty_zisha_kettle }
    process-ticks: 160
    output: { id: cgap:lemon_tea_zisha_kettle }
  # ===== 壶装抹茶：散粉直接冲点 =====
  matcha-drink-porcelain-kettle:
    inputs:
      leaf: { id: cgap:matcha_tea_leaf, amount: 6 }
