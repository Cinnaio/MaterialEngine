plugins {
    id 'java'
    id 'xyz.jpenilla.run-paper' version '3.0.2'
}

group = 'com.github.cinnaio'
version = '2.5.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'momirealms'
        url = 'https://repo.momirealms.net/releases/'
        metadataSources {
            mavenPom()
            artifact()
        }
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.74-stable'
    compileOnly 'net.momirealms:craft-engine-core:26.8'
    compileOnly 'net.momirealms:craft-engine-bukkit:26.8'
    testImplementation 'io.papermc.paper:paper-api:26.1.2.build.74-stable'
    testImplementation 'net.momirealms:craft-engine-core:26.8'
    testImplementation 'net.momirealms:craft-engine-bukkit:26.8'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.46.1.0'
}

test {
    useJUnitPlatform()
    systemProperty 'craftengine.runtimeJar', providers.gradleProperty('craftEngineRuntimeJar').getOrElse('')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks {
    compileJava {
        options.encoding = 'UTF-8'
    }

    processResources {
        filteringCharset = 'UTF-8'
        inputs.property('version', project.version)
        filesMatching('paper-plugin.yml') {
            expand(version: project.version)
        }
    }

    runServer {
        minecraftVersion('26.1.2')
    }
}
